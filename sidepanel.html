<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ToS Risk Raporu</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 12px; }
    .disclaimer { background: #fff3cd; padding: 8px; border-radius: 6px; font-size: 13px; }
    button { margin: 6px 0; padding: 8px 12px; cursor: pointer; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    pre { white-space: pre-wrap; font-size: 12px; background: #f4f4f4; padding: 8px; border-radius: 6px; max-height: 350px; overflow: auto; }
    details { margin: 10px 0; }
  </style>
</head>
<body>
  <h3>ToS Risk Raporu</h3>
  <div class="disclaimer">
    ⚠️ Bu araç hukuki tavsiye vermez. Sonuçlar bilgilendirme amaçlıdır.
  </div>

  <details open>
    <summary>Ayarlar</summary>
        <input id="apiKey" type="password" placeholder="Groq API anahtarı (gsk_ ile başlar)">
    <button id="saveKey">Kaydet</button>
    <button id="testLlm">LLM bağlantısını test et</button>
    <div id="keyStatus"></div>
  </details>

  <button id="analyze">Analiz et</button>
  <div id="info"></div>
  <pre id="output"></pre>
    <button id="exportBtn">Sonucu JSON olarak indir</button>
      <div id="report"></div>
  <script src="llm.js"></script>
  <script src="validator.js"></script>
  <script src="analyze.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
